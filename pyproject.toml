[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
# 散佈版本遵循 PEP440；執行期版軌標記為 "6.1-lite"（見 scripts/__init__.py）
name = "toknife-lite"
version = "6.1.0"
description = "Toknife Lite: input-side token compression for OpenAI-compatible LLM APIs (JSON/code/history compression, transparent local proxy). MIT, zero hard dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "momogigi123"}]
keywords = ["token", "compression", "llm", "mcp", "context-window", "openai", "cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []  # 核心零第三方依賴，純 Python 標準庫

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.5.0"]  # 精確 token 計數（可選，缺失自動降級為估算）
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
ts = "token_saver.cli:main"
toknife-lite = "token_saver.cli:main"

[project.urls]
Homepage = "https://github.com/momogigi123/toknife"
Documentation = "https://github.com/momogigi123/toknife#readme"
Issues = "https://github.com/momogigi123/toknife/issues"

[tool.setuptools.package-dir]
token_saver = "scripts"

[tool.setuptools]
packages = ["token_saver"]

[tool.setuptools.package-data]
token_saver = ["*.json", "*.jsonl", "*.md"]
